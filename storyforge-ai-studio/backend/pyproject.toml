[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storyforge-backend"
version = "0.1.0"
description = "StoryForge AI Studio API and media workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "redis>=5,<7",
  "celery>=5.4,<6",
  "boto3>=1.35,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "jsonschema>=4.23,<5",
  "PyJWT>=2.8,<3",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.1,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-redis>=4.6",
  "types-jsonschema>=4.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]  # no type stubs published
ignore_missing_imports = true
