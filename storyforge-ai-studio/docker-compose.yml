services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: storyforge
      POSTGRES_USER: storyforge
      POSTGRES_PASSWORD: storyforge_dev_only
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyforge -d storyforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://storyforge:storyforge_dev_only@postgres:5432/storyforge
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_ROOT: /app/media_data
      MANIFEST_SCHEMA_PATH: /schema/EDIT_MANIFEST.schema.json
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      COMFYUI_BASE_URL: http://host.docker.internal:8188
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./EDIT_MANIFEST.schema.json:/schema/EDIT_MANIFEST.schema.json:ro
      - media_data:/app/media_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://storyforge:storyforge_dev_only@postgres:5432/storyforge
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_ROOT: /app/media_data
      MANIFEST_SCHEMA_PATH: /schema/EDIT_MANIFEST.schema.json
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      COMFYUI_BASE_URL: http://host.docker.internal:8188
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./EDIT_MANIFEST.schema.json:/schema/EDIT_MANIFEST.schema.json:ro
      - media_data:/app/media_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]

volumes:
  postgres_data:
  redis_data:
  media_data:
