# StoryForge AI Studio CI. Lives at the repository root: GitHub only reads .github/ here.
# Action versions verified 2026-11-16 against the official READMEs of
# actions/setup-python (v7), subosito/flutter-action (v2) and actions/checkout (v6).
name: storyforge-ci

on:
  push:
    branches: [main, "dev/**", "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: storyforge-ai-studio/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storyforge_test
          POSTGRES_USER: storyforge
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U storyforge -d storyforge_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: storyforge-ai-studio/backend/pyproject.toml
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://storyforge:ci_only_password@localhost:5432/storyforge_test
        run: pytest -q
      - name: Migration round trip (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://storyforge:ci_only_password@localhost:5432/storyforge_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: storyforge-ai-studio/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.2
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
